name: CI/CD - Deploy Crop Recommender to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the latest code in the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Simple CI: check backend installs and imports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test FastAPI app imports
        run: |
          python - << 'EOF'
          import app
          print("FastAPI app imported successfully")
          EOF

      # 3) CD: SSH into EC2 and run docker-compose
      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/crop-platform
            git pull origin main
            docker-compose down || true
            docker-compose up -d --build