events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression to speed up asset delivery over the network
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # 1. Serve React app + static assets (CSS/JS)
        location / {
            try_files $uri $uri/ /index.html;
            
            # Explicitly tell downstream browsers to revalidate index.html 
            # This stops the old UI code from getting stuck in the browser cache!
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # Cache control override for static compilation chunks (JS/CSS)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # 2. Proxy /predict directly to the FastAPI service root endpoint
        location /predict {
            proxy_pass http://crop-api-service:8000/predict;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent Nginx from caching API responses (avoids old predictions stuck on screen)
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }
}