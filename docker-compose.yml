version: "3.8"

services:
  crop-api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - crop-api-service