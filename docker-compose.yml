version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile        # backend Dockerfile (for FastAPI)
    container_name: crop-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile        # your frontend Dockerfile name
    container_name: crop-frontend
    restart: unless-stopped
    ports:
      - "80:80"                     # serve React on port 80
    depends_on:
      - api