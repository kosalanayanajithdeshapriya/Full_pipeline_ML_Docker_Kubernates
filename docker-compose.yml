version: "3.8"

services:
  # 1. FastAPI Model Endpoint Engine (Pulled from Docker Hub)
  crop-api-service:
    image: kosala2002/crop-backend:latest
    container_name: crop-api
    restart: unless-stopped
    expose:
      - "8000" # Internal communication within Docker bridge network
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000

  # 2. Production React Compiled Frontend (Built Locally from sub-folder)
  frontend:
    build:
      context: ./frontend  # 👈 FIX: Root එකේ තියෙන Python එක වෙනුවට React code තියෙන folder එක දීම
      dockerfile: Dockerfile
    container_name: crop-frontend
    restart: unless-stopped
    expose:
      - "80" # Internal communication within Docker bridge network
    environment:
      - VIRTUAL_HOST=croprecommendor.work.gd
      - LETSENCRYPT_HOST=croprecommendor.work.gd
      - LETSENCRYPT_EMAIL=deshapriyakosala@gmail.com
    volumes:
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
    depends_on:
      - crop-api-service

  # 3. Automated Nginx Reverse Proxy Engine
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"   # Handles public inbound HTTP traffic
      - "443:443" # Handles public inbound secure HTTPS traffic
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: unless-stopped

  # 4. Asynchronous Automated SSL Handler (Let's Encrypt Acme Companion)
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    environment:
      - ACME_CA_URI=https://acme-staging-v02.api.letsencrypt.org/directory # 👈 FIX: Rate limit නොවී staging හරහා SSL ලැබීමට
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    restart: unless-stopped

# Named volumes used to securely share SSL keys and configs across the proxy containers
volumes:
  certs:
  vhost:
  html:
  acme: