version: "3.8"

services:
  # 1. FastAPI Model Endpoint Engine (Pulled from Docker Hub)
  crop-api-service:
    image: kosala2002/crop-backend:latest  # 👈 බැකෙන්ඩ් ඉමේජ් එක මෙතනට විතරයි එන්න ඕනේ!
    container_name: crop-api
    restart: unless-stopped
    expose:
      - "8000" # Internal communication within Docker bridge network
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000

  # 2. Production React Compiled Frontend (Built Locally)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile  # 👈 ඔයාගේ ලෝකල් React Dockerfile එක කියවන්නේ මෙතනින්!
    container_name: crop-frontend
    restart: unless-stopped
    expose:
      - "80" # Internal communication within Docker bridge network
    environment:
      - VIRTUAL_HOST=croprecommendor.work.gd
      - LETSENCRYPT_HOST=croprecommendor.work.gd
      - LETSENCRYPT_EMAIL=deshapriyakosala@gmail.com
    volumes:
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
    depends_on:
      - crop-api-service

  # 3. Automated Nginx Reverse Proxy Engine
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: unless-stopped

  # 4. Asynchronous Automated SSL Handler (Let's Encrypt Acme Companion)
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    environment:
      - ACME_CA_URI=https://acme-staging-v02.api.letsencrypt.org/directory # 👈 Staging URI එක
      - NGINX_PROXY_CONTAINER=nginx-proxy 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    restart: unless-stopped

volumes:
  certs:
  vhost:
  html:
  acme: