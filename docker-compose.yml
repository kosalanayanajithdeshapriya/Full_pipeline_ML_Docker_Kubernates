version: "3.8"

services:
  # 1. FastAPI Model Endpoint Engine
  crop-api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-api
    restart: unless-stopped
    expose:
      - "8000" 
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - VIRTUAL_HOST=croprecommendor.work.gd
      - VIRTUAL_PORT=8000

  # 2. Production React Compiled Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop-frontend
    restart: unless-stopped
    expose:
      - "80" 
    environment:
      - VIRTUAL_HOST=croprecommendor.work.gd
      - LETSENCRYPT_HOST=croprecommendor.work.gd
      - LETSENCRYPT_EMAIL=your-email@example.com # Replace with your real email
    depends_on:
      - crop-api-service

  # 3. Automated Nginx Reverse Proxy Engine
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: unless-stopped

  # 4. Asynchronous Automated SSL Handler (Let's Encrypt Acme Companion)
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy # 👈 CRITICAL FIX: Explicitly links the proxy container ID
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    restart: unless-stopped

volumes:
  certs:
  vhost:
  html:
  acme: